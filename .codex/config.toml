# Project-scoped Codex defaults for Trellis workflows.
# Codex merges this layer after the user-level config when the project
# is marked as a trusted project. To trust this project or a Codex-created
# worktree for it, add that path under `[projects]` in ~/.codex/config.toml, e.g.:
#
#   [projects."/abs/path/to/this/repo"]
#   trust_level = "trusted"

# Keep AGENTS.md as the primary project instruction file.
project_doc_fallback_filenames = ["AGENTS.md"]

# Codex hooks (`hooks.json` in this directory) are normally enabled by
# current Codex releases unless the user/admin explicitly disables them,
# for example with `[features].hooks = false` in ~/.codex/config.toml.
# Project-level config.toml cannot override user/admin feature policy.
# Codex additionally gates each installed hook behind a one-time `/hooks`
# review; until the user approves it, the hook file exists but stays inactive.

# NOTE: Trellis intentionally does NOT write a [features.multi_agent_v2]
# block here. Codex CLI changed `features` deserialization between 0.130
# and 0.131: the structured table form (with max_concurrent_threads_per_session
# / *_wait_timeout_ms) is only accepted by 0.131+. On 0.130 and earlier —
# including the codex CLI bundled inside the Codex desktop app — it fails
# with `data did not match any variant of untagged enum FeatureToml`, which
# aborts the entire config load and blocks Codex from starting. Codex's own
# default for multi_agent_v2 is used instead; tune it in your user-level
# config if needed.
#
# This project config intentionally does not set approval_policy, sandbox_mode,
# model provider, auth, telemetry, notification, or profile selectors. Keep
# machine/user risk posture in ~/.codex/config.toml; keep this file for shared
# Trellis project behavior only.
